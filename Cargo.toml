[workspace]
resolver = "2"
members = [
    "tosho",
    "tosho_musq",
    "tosho_kmkc",
    "tosho_amap",
    "tosho_sjv",
    "tosho_rbean",
    "tosho_mplus",
    "tosho_nids",
    "tosho_macros",
    "tosho_common",
]

[workspace.package]
version = "0.9.3-dev"
edition = "2024"
authors = ["noaione <noaione@n4o.xyz>"]
license = "MIT"
repository = "https://github.com/noaione/tosho-mango"
homepage = "https://github.com/noaione/tosho-mango"
rust-version = "1.88.0"

[workspace.dependencies]
# Tokio related
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.34"

# JSON/Protobuf related
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
prost = "0.14.4"

# Utilities
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller"] }
base64 = "0.22.1"
sha2 = "0.11.0"
time = "0.3.55"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rand = "0.10.2"
md-5 = "0.11.0"
uuid = { version = "=1.26.0", features = ["v4", "fast-rng"] }
num-format = "0.4.4"
regex = "1.13.1"
aho-corasick = "1.1.5"
secular = "1.0.1"

# HTTP related
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "charset", "http2", "socks", "query", "form", "stream"] }
reqwest_cookie_store = "0.10.0"
urlencoding = "2.1.3"

# Image
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
kamadak-exif = "0.6.1"

# Filesystem related
mime_guess = "2.0.5"
glob = "0.3.4"
directories = "6.0.0"

# AES related
aes = "0.9.2"
cbc = "0.2.1"

# CLI related
clap = { version = "4.6.6", features = ["derive"] }
anstream = "1.0.0"
color-print = "0.3.7"
inquire = "0.9.4"
indicatif = "0.18.6"
supports-hyperlinks = "3.2.0"
self_update = { version = "0.44.0", default-features = false, features = [
    "rustls",
    "reqwest",
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate"
] }

# Windows deps
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_System_Console"] }

# CI build profile, very optimized
[profile.ci]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

## Enable limited debug info for tosho package
[profile.ci.package.tosho]
debug = "limited"

[profile.release.package.tosho]
debug = "limited"
